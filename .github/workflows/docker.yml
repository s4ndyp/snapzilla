name: Docker CI/CD voor Snapzilla

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - context: ./web
            image_suffix: web
          - context: ./analyzer
            image_suffix: analyzer

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stel image tag in
        id: set_tag
        run: |
          IMAGE="ghcr.io/${{ github.repository }}-${{ matrix.image_suffix }}:latest"
          echo "full_tag=$IMAGE" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in op GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bouw en push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.set_tag.outputs.full_tag }}
